<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>suzunokana | Official WebApp</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --news-bg: #eff6ff;
            --news-text: #1d4ed8;
            --comment-bg: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.1);
        }

        body { font-family: sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }

        /* コンテンツエリア */
        #site-wrapper { display: flex; flex-direction: column; min-height: 100vh; flex: 1; }
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px 24px; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1000px; width: 100%; margin: 0 auto; padding: 30px 24px; box-sizing: border-box; flex: 1; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        
        /* 緊急フォームのデザイン（どこに置いてもOK！） */
        .emergency-form { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-top: 20px; }
        .form-label { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 8px; }
        .emergency-input, .emergency-textarea { width: 100%; background-color: var(--comment-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        .emergency-btn { width: 100%; background-color: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        /* アップデート画面 */
        #update-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-body); z-index: 10000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- 🛠️ アップデート中画面 -->
    <div id="update-screen">
        <div class="card" style="max-width: 400px; text-align: center;">
            <h2>SYSTEM UPDATE</h2>
            <p>ただいまメンテナンス中です。</p>
        </div>
    </div>

    <!-- 🌐 通常サイト -->
    <div id="site-wrapper">
        <header>
            <div class="nav-container">
                <h1>suzunokana</h1>
            </div>
        </header>

        <main>
            <div class="card">
                <h2>Welcome</h2>
                <p>suzunokanaのウェブアプリです。</p>
            </div>

            <!-- ✨ 常設のコメント/報告フォーム -->
            <div class="emergency-form">
                <label class="form-label">名前</label>
                <input type="text" id="emergency-name" class="emergency-input" placeholder="お名前">
                <label class="form-label">メッセージ・不具合報告</label>
                <textarea id="emergency-msg" class="emergency-textarea" placeholder="何かあればこちらから！"></textarea>
                <button id="emergency-submit" class="emergency-btn" onclick="sendEmergencyNotification()">🚀 送信 (Discord通知)</button>
            </div>
        </main>
    </div>

    <script>
        const SERVICE_DOMAIN = "suzunokana-scratch-hp";
        const API_KEY = "6kGhbe0iVydvBuusl3S0XcmWs9YM3JmIWTFI";
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1522167677878276145/fePGClXiWVOhvn5uBVsLhKH2deXbcNVY8Xj0u7SAqEjXBf3fdyncGbOXSUzsC-SpfjWz";

        // 🚀 いつでも送信できる関数
        async function sendEmergencyNotification() {
            const name = document.getElementById("emergency-name").value || "匿名";
            const msg = document.getElementById("emergency-msg").value;
            if (!msg) return alert("内容を入力してください");

            const btn = document.getElementById("emergency-submit");
            btn.disabled = true;
            btn.innerText = "送信中...";

            const payload = {
                username: "サイト通知",
                embeds: [{ title: "💬 新しいメッセージ/報告", fields: [{ name: "名前", value: name }, { name: "内容", value: msg }] }]
            };

            await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            alert("送信しました！");
            btn.disabled = false;
            btn.innerText = "🚀 送信 (Discord通知)";
            document.getElementById("emergency-msg").value = "";
        }

        // アップデート判定（これはそのまま）
        async function fetchMicroCMSData() {
            const response = await fetch(`https://${SERVICE_DOMAIN}.microcms.io/api/v1/api`, { headers: { "X-MICROCMS-API-KEY": API_KEY } });
            const data = await response.json();
            if (data.is_updating) {
                document.getElementById("site-wrapper").style.display = "none";
                document.getElementById("update-screen").style.display = "flex";
            } else {
                document.getElementById("site-wrapper").style.display = "flex";
                document.getElementById("update-screen").style.display = "none";
            }
        }
        fetchMicroCMSData();
        setInterval(fetchMicroCMSData, 15000);
    </script>
</body>
</html>
